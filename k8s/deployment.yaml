apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartinfra-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smartinfra-api
  template:
    metadata:
      labels:
        app: smartinfra-api
    spec:
      containers:
      - name: smartinfra-api
        image: smartinfra-ml-api:latest
        ports:
        - containerPort: 8000
